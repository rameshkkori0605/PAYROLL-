<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Apex Payroll Management System</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: radial-gradient(circle at 10% 20%, #0f172a 0%, #020617 90%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: var(--radius-lg);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
      padding: 2.5rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-logo {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #2563eb, #60a5fa);
      border-radius: var(--radius-md);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.6rem;
      font-weight: 800;
      box-shadow: 0 8px 16px rgba(37, 99, 235, 0.35);
      margin-bottom: 1rem;
    }
    .demo-credentials-box {
      margin-top: 1.75rem;
      padding: 1rem;
      background: var(--slate-50);
      border: 1px dashed var(--slate-300);
      border-radius: var(--radius-md);
      font-size: 0.8rem;
      color: var(--slate-600);
    }
    .demo-pill {
      display: inline-block;
      background: #e2e8f0;
      color: #1e293b;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <div class="login-logo">₹</div>
      <h2 style="font-size: 1.5rem; font-weight: 800; color: #0f172a; letter-spacing: -0.02em;">Payroll Portal</h2>
      <p style="color: #64748b; font-size: 0.85rem; margin-top: 0.25rem;">Enterprise Payroll & Compensation Suite</p>
    </div>

    <form id="login-form">
      <div style="margin-bottom: 1.25rem;">
        <label class="form-label required" for="username">Administrator Username</label>
        <input type="text" id="username" class="form-control" style="width: 100%;" placeholder="e.g. admin" required autofocus>
      </div>

      <div style="margin-bottom: 1.5rem;">
        <label class="form-label required" for="password">Password</label>
        <input type="password" id="password" class="form-control" style="width: 100%;" placeholder="••••••••" required>
      </div>

      <button type="submit" id="btn-login" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 0.95rem;">
        Sign In to Dashboard
      </button>
    </form>

    <div class="demo-credentials-box">
      <div style="font-weight: 700; color: #0f172a; margin-bottom: 0.35rem;">Demo Credentials:</div>
      <div>Admin: <span class="demo-pill" onclick="fillCredentials('admin', 'admin123')">admin</span> / <span class="demo-pill" onclick="fillCredentials('admin', 'admin123')">admin123</span></div>
      <div style="margin-top: 0.25rem;">HR Admin: <span class="demo-pill" onclick="fillCredentials('hr_admin', 'hr123')">hr_admin</span> / <span class="demo-pill" onclick="fillCredentials('hr_admin', 'hr123')">hr123</span></div>
      <div style="font-size: 0.72rem; color: #94a3b8; margin-top: 0.4rem;">Click any credential pill above to auto-fill.</div>
    </div>
  </div>

  <script src="js/script.js"></script>
  <script>
    function fillCredentials(u, p) {
      document.getElementById('username').value = u;
      document.getElementById('password').value = p;
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Check if session already active
      App.Auth.checkSession(true);

      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-login');
        btn.disabled = true;
        btn.textContent = 'Verifying credentials...';

        try {
          const u = document.getElementById('username').value.trim();
          const p = document.getElementById('password').value;
          await App.Auth.login(u, p);
        } catch (err) {
          btn.disabled = false;
          btn.textContent = 'Sign In to Dashboard';
        }
      });
    });
  </script>
</body>
</html>
